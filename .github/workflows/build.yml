# On every push and pull request, GitHub builds the mod, runs all the tests (unit tests, the
# self-check demo and every GameTest in a real Minecraft test world), and keeps the mod jar
# as a download on the run's page.
name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
# A newer push to the same branch or pull request stops the run it supersedes: the whole run takes about an hour.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew --no-daemon clean build
      - run: bash ./gradlew --no-daemon :companion-testkit:run
      - run: bash ./gradlew --no-daemon :companion-server-adapter:runGametest
      - uses: actions/upload-artifact@v4
        with:
          name: kindred-mc-development
          path: companion-server-adapter/build/libs/kindred-mc-*.jar
          if-no-files-found: error
