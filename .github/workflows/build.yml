# On every pull request, and on every push to main, GitHub builds the mod, runs all the tests (unit
# tests, the self-check demo and every GameTest in a real Minecraft test world), and keeps the mod jar
# as a download on the run's page. A push to any other branch runs nothing on its own: its pull request
# runs the suite once a push, where before the push and the pull request each ran it, an hour a run.
name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A newer push to the same branch or pull request stops the run it supersedes: the whole run takes about an hour.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  support:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test offline validation tools
        run: python3 -m unittest discover -s tools/support-batch-01 -v
      - name: Test the evaluation engine's scoring and comparison
        run: python3 -m unittest discover -s tools/eval -v
      - name: Check pinned versions
        run: python3 tools/support-batch-01/support.py manifest
      - name: Check tracker IDs and evidence references
        run: python3 tools/support-batch-01/support.py tracker
      - name: Check every GameTest class is registered
        run: python3 tools/support-batch-01/support.py entrypoints
  build:
    runs-on: ubuntu-latest
    # The build and the whole native suite: on 2 November the suite outgrew 60 minutes (cut off at about 93%).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run JUnit tests
        id: build
        run: bash ./gradlew --no-daemon clean build
      - name: Run contract demonstration
        id: testkit
        run: bash ./gradlew --no-daemon :companion-testkit:run
      - name: Run native GameTests
        id: native
        run: bash ./gradlew --no-daemon :companion-server-adapter:runGametest
      - name: Summarize this run, including missing or failed tests
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TESTKIT_OUTCOME: ${{ steps.testkit.outcome }}
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
        run: >-
          python3 tools/support-batch-01/ci_report.py
          --build-outcome "$BUILD_OUTCOME"
          --testkit-outcome "$TESTKIT_OUTCOME"
          --native-outcome "$NATIVE_OUTCOME"
      - name: Retain test evidence even when validation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kindred-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci-evidence/
            companion-*/build/test-results/test/TEST-*.xml
            companion-server-adapter/build/gametest-results.xml
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: kindred-mc-development
          path: companion-server-adapter/build/libs/kindred-mc-*.jar
          if-no-files-found: error
