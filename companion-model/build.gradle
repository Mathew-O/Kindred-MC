// Optional inference boundary. Core never depends on it; the server adapter uses it only for the optional strategist (off by default).
dependencies {
    api project(':companion-core')
    // The official Anthropic Java SDK, pinned (see release-manifest.json): the Claude strategist's transport (F-19b).
    implementation 'com.anthropic:anthropic-java:2.75.0'
    // Gson for the OpenAI-compatible strategist (F-19d): the version Minecraft 1.21.1 ships and supplies at runtime, so
    // nothing more is bundled.
    compileOnly 'com.google.code.gson:gson:2.10.1'
    testImplementation 'com.google.code.gson:gson:2.10.1'
}
