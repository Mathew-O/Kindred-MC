// Small programs you can run without Minecraft:
//   ./gradlew :companion-testkit:run                  the self-check demo
//   ./gradlew :companion-testkit:runPersonalityDemo   how personality changes job choice
//   ./gradlew :companion-testkit:runMetrics --args=<server log>   scores a play session
//   ./gradlew :companion-testkit:runRecordAudit --args=<companions.sqlite>   the faction rules over a kept Record
plugins { id 'application' }

dependencies {
    implementation project(':companion-core')
    implementation project(':companion-scheduler')
    implementation project(':companion-persistence')
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.17'
}

application { mainClass = 'dev.kindred.testkit.FoundationDemo' }

tasks.register('runPersonalityDemo', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.kindred.testkit.PersonalityDemo'
}

tasks.register('runMetrics', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.kindred.testkit.RunMetrics'
}

tasks.register('trainMelee', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.kindred.testkit.TrainMelee'
}

tasks.register('runRecordAudit', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.kindred.testkit.RecordAudit'
}
