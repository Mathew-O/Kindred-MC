# Kindred Factions (M-06j draft): the server's own settings for the month run. Vanilla keys only; anything not here
# keeps vanilla's default. Kindred enforces the faction rules itself: PvP is on so that only its rules (enemy
# factions, never in a safe zone) decide who may strike whom, and vanilla's spawn protection is off because Kindred's
# hub is the safe zone.
motd=Kindred Factions
gamemode=survival
difficulty=normal
hardcore=false
pvp=true
spawn-protection=0
max-players=30
online-mode=true
enforce-secure-profile=true
white-list=true
enforce-whitelist=true
view-distance=10
simulation-distance=8
sync-chunk-writes=false
max-tick-time=60000
allow-flight=false
allow-nether=true
spawn-monsters=true
spawn-animals=true
spawn-npcs=true
level-type=minecraft\:normal
