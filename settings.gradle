pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'kindred-mc'
include 'companion-core', 'companion-scheduler', 'companion-persistence', 'companion-testkit', 'companion-server-adapter', 'companion-model', 'kindred-world-design'
